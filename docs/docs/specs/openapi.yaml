          in: query
          required: false
          schema:
            type: string
            enum: [gzip, base64]
      responses:
        "200":
          description: Portable dataset archive

  /v1/ml/dataset:import:
    post:
      tags: [AI Detector & Traces]
      summary: Import a .tar.gz dataset and model archive exported from another SlapRF device
      operationId: importMLDataset
