    DiagnosticLogStatus:
      type: object
      required: [logPath, sizeBytes, level, levels, lineCount]
      properties:
        logPath:
          type: string
          description: Absolute path to the active side-by-side `slaprf.log` file (empty when running in-memory only)
          example: "/opt/slaprf/slaprf.log"
        sizeBytes:
          type: integer
          description: Combined size in bytes of `slaprf.log` and any rotated `slaprf.log.1` backup
          example: 24576
        level:
          type: string
          enum: [trace, debug, info, warn, error]
          description: Active runtime log severity threshold
          example: info
        levels:
          type: array
          items:
            type: string
            enum: [trace, debug, info, warn, error]
          example: [trace, debug, info, warn, error]
        lineCount:
          type: integer
          description: Number of recent log lines currently buffered in memory
          example: 84
        maxLines:
          type: integer
          description: Capacity of the bounded in-memory ring buffer when running without an on-disk log file (such as standalone Browser Demo Mode)
          example: 1000

    DiagnosticLogResponse:
      allOf:
        - $ref: "#/components/schemas/DiagnosticLogStatus"
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items:
                type: string
              description: Chronological diagnostic log lines formatted as `TIMESTAMP [LEVEL] [Component] message`
              example:
                - "2026-11-22T23:14:03.055-08:00 [INFO] [Server] SlapRF ready: db=slaprf.db log=slaprf.log level=info"
