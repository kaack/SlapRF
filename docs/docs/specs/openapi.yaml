      operationId: getSimMultiGPAdmin
      responses:
        "200":
          description: Simulated MultiGP chapter state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimMultiGPState"

  "/v1/sim/multigp/admin:action":
    post:
      tags: ["Simulator (MultiGP)"]
      summary: Mutate the simulated MultiGP chapter, API key, pilot pool, races, ZippyQ rounds, heats, or seats
      operationId: runSimMultiGPAdminAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimMultiGPAdminAction"
      responses:
        "200":
          description: Updated simulated MultiGP chapter state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimMultiGPState"
        "400":
          description: Invalid MultiGP admin action or parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "pilot callsign is required"

  /v1/sim/multigp/{subPath}:
    parameters:
      - name: subPath
        in: path
        required: true
        description: Simulated MultiGP WebService v1.0.4 path (`chapter/findChapterFromApiKey`, `race/listForChapter`, `pilot/listForChapter`, `race/view`, `race/getAdditionalRounds`, `race/assignSlot`, `race/captureOverallRaceResult`).
        schema:
          type: string
    post:
      tags: ["Simulator (MultiGP)"]
      summary: Invoke an in-memory simulated MultiGP WebService v1.0.4 POST endpoint
      operationId: postSimMultiGPWebService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey:
                  type: string
                  example: "MGP-SIM-BAYAREA-2026"
                data:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Simulated MultiGP WebService response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  chapterId:
                    type: integer
                    example: 1042
                  chapterName:
                    type: string
                    example: "Bay Area FPV"
        "400":
          description: Invalid JSON request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  statusDescription:
                    type: string
                    example: "Invalid JSON request body"
        "401":
          description: Invalid simulated MultiGP Chapter API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  statusDescription:
                    type: string
                    example: "Invalid MultiGP Chapter API key"
    put:
      tags: ["Simulator (MultiGP)"]
      summary: Invoke an in-memory simulated MultiGP WebService v1.0.4 PUT endpoint
      operationId: putSimMultiGPWebService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey:
                  type: string
                  example: "MGP-SIM-BAYAREA-2026"
                data:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Simulated MultiGP WebService response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          description: Invalid JSON request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  statusDescription:
                    type: string
                    example: "Invalid JSON request body"
        "401":
          description: Invalid simulated MultiGP Chapter API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  statusDescription:
                    type: string
                    example: "Invalid MultiGP Chapter API key"

  /v1/logs:
    get:
      tags: [Logs]
      summary: Read recent Go server diagnostic log lines or download slaprf.log
      operationId: getLogs
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, text]
          description: Set to `text` to download the full rolling `slaprf.log` plain-text file
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Maximum number of chronological recent lines to return in JSON mode
      responses:
        "200":
          description: Diagnostic log snapshot or plain-text file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticLogResponse"
            text/plain:
              schema:
                type: string

  /v1/logs/config:
    get:
      tags: [Logs]
      summary: Read active diagnostic log level and slaprf.log file status
      operationId: getLogsConfig
      responses:
        "200":
          description: Diagnostic log configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticLogStatus"
    put:
      tags: [Logs]
      summary: Update runtime diagnostic log severity threshold
      operationId: putLogsConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: string
                  enum: [trace, debug, info, warn, error]
                  example: debug
      responses:
        "200":
          description: Updated diagnostic log configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticLogStatus"
        "400":
          description: Invalid log level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/logs:clear:
    post:
      tags: [Logs]
      summary: Truncate slaprf.log, remove rotated backups, and reset the in-memory log buffer
      operationId: clearLogs
      responses:
        "200":
          description: Cleared diagnostic log status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticLogStatus"

  /v1/practice/pack-loop:
    put:
      tags: [AI Detector & Traces]
      summary: Enable or configure the Hands-Free Pack Loop auto-session splitter
      operationId: putPracticePackLoop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packLoopEnabled:
                  type: boolean
                packLoopQuietSec:
                  type: integer
                  example: 25
                preemptOngoing:
                  type: boolean
      responses:
        "200":
          description: Updated application state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"

  /v1/practice/pack-loop:split:
    post:
      tags: [AI Detector & Traces]
      summary: Seal the active Practice pack trace immediately and arm the next pack
      operationId: splitPracticePackLoop
      responses:
        "200":
          description: Updated application state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"

  /v1/practice/sessions/{sessionId}/trace:
    get:
      tags: [AI Detector & Traces]
      summary: Read saved .rfbin raw RSSI telemetry batches for a Practice session
      operationId: getPracticeSessionTrace
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Encoded telemetry batches for historical Signals replay
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, sampleCount, rssiCount, batchesB64]
                properties:
                  sessionId:
                    type: string
                  sampleCount:
                    type: integer
                  rssiCount:
                    type: integer
                  batchesB64:
                    type: array
                    items:
                      type: string

  /v1/ml:
    get:
      tags: [AI Detector & Traces]
      summary: Read active AI detector configuration, dataset stats, live tunes, and model snapshots
      operationId: getMLStatus
      responses:
        "200":
          description: Current ML status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    patch:
      tags: [AI Detector & Traces]
      summary: Switch between Classic DSP and AI 1D TCN detector or toggle live 2-lap tuning
      operationId: patchMLConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                detectorMode:
                  type: string
                  enum: [classic, ai]
                activeModelId:
                  type: string
                liveTuneEnabled:
                  type: boolean
                teacherPackId:
                  type: string
                autoLabelOnTrain:
                  type: boolean
                resetLiveTunes:
                  type: boolean
      responses:
        "200":
          description: Updated ML status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/ml:train:
    post:
      tags: [AI Detector & Traces]
      summary: Start or continue background pure-Go 1D TCN model training on Practice traces
