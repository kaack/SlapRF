  "/v1/sim/rotorhazard/timers/{timerId}:scan":
    parameters:
      - name: timerId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: ["Simulator (RotorHazard)"]
      summary: Run or toggle a simulated 5.8 GHz spectrum sweep (`once`, `live`, `stop`) on a simulated RotorHazard USB node
      operationId: scanSimRotorHazardUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [once, live, stop]
                  example: once
                start:
                  type: integer
                  example: 5645
                stop:
                  type: integer
                  example: 5945
                step:
                  type: integer
                  example: 2
      responses:
        "200":
          description: Spectrum scan pass or live scan state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  scanLive:
                    type: boolean
                    example: false
                  scan:
                    $ref: "#/components/schemas/RHScanPass"
        "400":
          description: Invalid scan mode or frequency range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid scan mode (expected once, live, or stop)"
        "404":
          description: Simulated RotorHazard timer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "simulated RotorHazard unit not found"
        "409":
          description: Simulator is not currently running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "simulator is not running"

  /v1/sim/multigp/admin:
