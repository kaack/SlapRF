openapi: 3.1.0
info:
  title: SlapRF Timing & Race Management REST API
  version: 1.0.0
  summary: Versioned HTTP REST API (`/v1`) exposed by SlapRF Portable and the SlapRF Android LAN host.
  description: |
    SlapRF exposes a resource-oriented JSON REST API under `/v1` on `http://127.0.0.1:8090` (or `http://<host-ip>:8090` when started with `-lan`) for querying and managing live track telemetry, pilot directories, practice sessions, race tournament sessions, hardware transports, and database backups.

    ### REST Design Principles
    - **Resource CRUD & HTTP Status Codes**:
      - `GET`: Read collections, items, or singletons (`200 OK`, `404 Not Found`).
      - `POST` on collections: Create resources (`201 Created` with `Location` header, `409 Conflict`).
      - `PUT`: Idempotent full replacement of an item or singleton (`200 OK`, `404 Not Found`, `409 Conflict`).
      - `PATCH`: Partial attribute update of an item or singleton (`200 OK`, `404 Not Found`, `409 Conflict`).
      - `DELETE`: Remove an item from a collection (`200 OK`, `404 Not Found`, `409 Conflict`).
      - Unsupported HTTP methods return `405 Method Not Allowed` with an `Allow` header.
    - **Singletons & `:action` Custom Methods (AIP-136 / AIP-156)**:
      - Singletons (`/v1/storage`, `/v1/timing/arm`, `/v1/timing/mode`, `/v1/hardware/mode`, `/v1/sim`, `/v1/laprf-emulator`, `/v1/auth/config`, and scoped `.../track` / `.../track/rules`) always exist and never accept `DELETE`.
      - Imperative operations use `POST ...:<action>` (for example, `/v1/storage:reset`, `/v1/practice/sessions/{sessionId}/track:reset`, `/v1/practice/sessions/{sessionId}:start`, and `/v1/race/sessions/{sessionId}:pause`).
  license:
    name: MIT
    url: https://github.com/kaack/SlapRF
servers:
  - url: http://localhost:8090
    description: Local SlapRF Portable server (default)
  - url: http://{host}:{port}
    description: LAN SlapRF server (started with -lan)
    variables:
      host:
        default: 192.168.1.50
      port:
        default: "8090"
tags:
  - name: System & State
    description: |
      Core bootstrap, feature discovery, authentication, and live engine snapshot endpoints.
      - **Bootstrap & Polling**: Use `GET /v1/state` on initial client load to hydrate full state, and `GET /v1/status?lite=1` for lightweight heartbeats when WebSocket streaming is unavailable.
      - **Security**: `GET /v1/capabilities` is always accessible unauthenticated and reports `authRequired` and `authenticated` flags; manage HTTP Basic Auth via `/v1/auth/config` and verify credentials via `POST /v1/auth/sessions`.

  - name: Timing Singletons
    description: |
      Singleton resources controlling the active timing engine's arming state, operating mode, and hardware backend.
      - **Arming, Operating Mode & Hardware Mode (`/v1/timing/arm`, `/v1/timing/mode`, `/v1/hardware/mode`)**: Arm or disarm lap recording, switch between `practice` and `race` modes, and select the active timing hardware pipeline (`slaprf`, `slaprf_ble`, `laprf`, `laprf_usb`, `rotorhazard`, or `rotorhazard_usb`).

  - name: Pilots
    description: |
      Global 16-slot pilot roster shared across practice sessions and tournament brackets.
      - **CRUD & Unique Constraints**: Create pilots with `POST /v1/pilots` (`201 Created` + `Location` header) and update callsign, phonetic TTS name, VTX band/channel, or per-pilot thresholds via `PUT /v1/pilots/{slotIndex}`.
      - **Bulk Import & Export**: Merge pilots from CSV or MultiGP entries via `POST /v1/pilots:import` and export the roster via `GET /v1/pilots/export.csv`.

  - name: Timers
    description: |
      Physical and simulated receiver hardware inventory (`/v1/timers`) shared across practice sessions and race events.
      - **Discovery & Provisioning (`/v1/timers`)**: Inspect online status, battery voltage, and firmware versions for Hub `H1`, Spokes `T1`-`T6`, LapRF 8-Way pucks, and RotorHazard units, update display colors, or delete offline entries.

  - name: Practice Sessions
    description: |
      Multi-session practice management where each session owns its own pilot channels, course track, timing rules, and lap history.
      - **Session Addressing**: Pass an explicit `sessionId` or the literal alias `current` to target the currently selected practice session.
      - **Scoped Track & Timing Rules (`.../track/*`)**: Configure gates (`.../track/gates`), per-pilot thresholds (`.../track/thresholds`), track-wide timing rules (`.../track/rules`), and per-gate or per-pilot-at-gate rule overrides independently for each practice session.
      - **Lifecycle Actions**: Transition sessions with `:start`, `:pause`, `:resume`, `:stop`, and `:clearLaps`, and validate or invalidate individual laps via `PATCH .../laps/{lapId}` or `POST .../laps/{lapId}:toggle`.

  - name: Race Sessions
    description: |
      Full tournament race control covering qualifying rounds, double-elimination / multi-stage DAG brackets, Open Qualifier (ZippyQ), independent per-race tracks and timing rules, marshal overrides, and MultiGP RaceSync integration.
      - **Scoped Track & Timing Rules (`.../track/*`)**: Configure gates (`.../track/gates`), per-pilot thresholds (`.../track/thresholds`), track-wide timing rules (`.../track/rules`), and per-gate or per-pilot-at-gate rule overrides independently for each race (`409 Conflict` once a race is `completed` or `scrapped`).
      - **Lifecycle & Heat Control**: Drive session state (`:start`, `:pause`, `:resume`, `:stop`, `:complete`, `:scrap`, `:reopen`), stage progression (`stages/{stageRef}:control`, `:advance`), and live heat horns/clocks (`heats/{heatId}:control`).
      - **Marshal & MultiGP Sync**: Apply lap toggles, time penalties, or seat reorders via `pilots/{slotIndex}:marshal`, import MultiGP chapters via `sessions:importMultiGP`, and push results through `/v1/race/multigp/proxy/{subPath}`.

  - name: SlapRF Hardware (USB)
    description: |
      Native USB-C serial transport for Seeed Studio XIAO ESP32-C5 Hub (`H1`) and Spoke (`T1`-`T6`) timers (`/v1/slaprf/usb/*`).
      - **Port Discovery & Console Pool (`ports`, `connections`, `debug-slot`)**: Enumerate local USB-C serial ports, connect or disconnect Hub `H1` and standalone Spoke slots, and select the active diagnostic slot.
      - **Commands, Spectrum Survey & Timer Registry (`:command`, `survey`, `known-timers/{fp}`)**: Send serial console commands, run full `5.8 GHz` Raceband spectrum surveys, and forget saved timer fingerprints.

  - name: SlapRF Hardware (Bluetooth)
    description: |
      Wireless Bluetooth LE transport for Seeed Studio XIAO ESP32-C5 Bluetooth Hubs (`/v1/slaprf/bluetooth/*`).
      - **Discovery, Pairing & Remembered Connect (`ports`, `connections`)**: Scan nearby `ble:<FP>` Hubs, pair unclaimed Hubs, reconnect remembered Hubs, cancel in-flight connection attempts, or wirelessly unpair and forget a Hub (`DELETE ...?forget=1`).
      - **Commands & Spectrum Survey (`:command`, `survey`)**: Send console commands and run `5.8 GHz` Raceband surveys over GATT NUS without USB cables.

  - name: LapRF 8-Way Hardware
    description: |
      External ImmersionRC LapRF 8-Way hardware connections over Ethernet LAN or USB CDC serial (`/v1/laprf/*`).
      - **Network & USB Discovery (`network/devices`, `usb/ports`)**: Probe the local subnet on TCP `:5403` for `LapRF 8-Way (Network)` units or list `115200` baud USB CDC ports for `LapRF 8-Way (USB)` units.
      - **Connections & Slot Sync (`connections`, `:sync`)**: Open or close Ethernet/USB LapRF sessions and push active pilot `5.8 GHz` frequencies and slot thresholds.

  - name: RotorHazard Hardware
    description: |
      External RotorHazard server (`HTTP` / `Socket.IO` `:5000`) and direct RotorHazard USB serial node connections (`/v1/rotorhazard/*`).
      - **Network & USB Discovery (`network/devices`, `usb/ports`)**: Scan the local subnet for `RotorHazard (Network)` servers or enumerate `RotorHazard (USB)` binary serial ports (`115200` / `921600` baud).
      - **Connections, Scans & Node Sync (`connections`, `:scan`, `debug-stream`, `:sync`)**: Connect authenticated RotorHazard servers or USB nodes, run `5180`-`5945 MHz` spectrum sweeps on USB nodes, stream `0`-`255` debug RSSI, and sync node frequencies and Enter/Exit levels.

  - name: LapRF 8-Way Emulator
    description: |
      Built-in ImmersionRC LapRF 8-Way TCP `:5403` server singleton (`/v1/laprf-emulator`).
      - **External Client Relay**: Streams SlapRF gate crossings over the binary LapRF TCP `:5403` protocol so third-party race control software (such as LiveTime) or broadcast overlays can ingest live passes in real time.

  - name: Simulator (Flight & Pilots)
    description: |
      Flight physics, RF signal propagation, speed multiplier, and pilot event controls for offline testing and marshal training (`/v1/sim`, `/v1/sim:packBurst`, `/v1/sim/pilots/{slotIndex}:action`).
      - **Engine & Speed Controls (`/v1/sim`)**: Read or update simulator execution (`running`), playback speed (`speedMultiplier`), and automatic track-walker recovery (`trackWalker`).
      - **Pack Bursts & Pilot Events (`:packBurst`, `pilots/{slotIndex}:action`)**: Trigger synchronized 6S launch bursts or individual pilot flight events (`crash`, `recover`, `walk-recover`, `pit`, `pause`, `break`, `launch`, `resume`, `refill-launch`).

  - name: Simulator (SlapRF)
    description: |
      Virtual Seeed Studio XIAO ESP32-C5 Hub and Spoke nodes for offline SlapRF hardware simulation (`/v1/sim/slaprf/*`).
      - **Virtual USB Link & Handshake (`hub-usb`, `usb-hellos`)**: Plug or unplug the simulated Hub `H1` virtual USB cable and read raw `0x1E`-framed `HELLO` packets for Hub `H1` and active Spokes.
      - **Simulated Timers & Firmware Actions (`timers`, `:action`, `:flash`, `:erase`, `:togglePower`, `rssi`)**: Add, configure, flash, erase, power-cycle, or delete simulated ESP32-C5 boards and inspect per-slot simulated RSSI.

  - name: Simulator (LapRF 8-Way)
    description: |
      Virtual ImmersionRC LapRF 8-Way pucks for offline Ethernet and USB timing simulation (`/v1/sim/laprf/*`).
      - **Virtual LAN Discovery (`devices`)**: Scan the simulated `192.168.1.0/24` subnet for powered-on virtual LapRF pucks on TCP `:5403`.
      - **Simulated Timers & Actions (`timers`, `:reset`, `:action`)**: Add, connect, disconnect, power-cycle, or update host, port, and supply voltage on virtual LapRF 8-Way timers.

  - name: Simulator (RotorHazard)
    description: |
      Virtual RotorHazard network servers (`:5000`) and USB serial nodes (`115200` / `921600` baud) for offline timing and spectrum simulation (`/v1/sim/rotorhazard/*`).
      - **Virtual Device Discovery (`devices`)**: Discover simulated RotorHazard network servers and USB serial nodes.
      - **Simulated Timers & Spectrum Scans (`timers`, `:reset`, `:action`, `:scan`)**: Add, configure, or power-cycle virtual RotorHazard timers and run simulated `5.8 GHz` spectrum sweeps (`once`, `live`, `stop`).

  - name: Simulator (MultiGP)
    description: |
      In-memory MultiGP RaceSync `v1.0.4` chapter server and admin controls for offline schedule import, ZippyQ walk-up rounds, and result upload testing (`/v1/sim/multigp/*`).
      - **Chapter & Schedule Admin (`/v1/sim/multigp/admin`, `admin:action`)**: Inspect or mutate the simulated chapter name, API key, pilot pool, controlled-schedule rounds, and dynamic ZippyQ queues.
      - **WebService `v1.0.4` Endpoints (`/v1/sim/multigp/{subPath}`)**: Execute `chapter/findChapterFromApiKey`, `race/listForChapter`, `race/view`, `race/getAdditionalRounds`, `race/assignSlot`, and `race/captureOverallRaceResult` against the in-memory chapter store.

  - name: Storage
    description: |
      Database inspection, JSON backup/restore, and showcase dataset management for both real-hardware and simulator workspaces.
      - **Real & Simulator Snapshots**: Export or restore real-hardware state via `/v1/storage` and simulator state via `/v1/storage/sim`.
      - **Maintenance Actions**: Check `bbolt` file size and record counts via `GET /v1/storage/status`, seed the showcase event via `POST /v1/storage:restoreDemo`, or wipe back to clean defaults via `POST /v1/storage:reset`.

  - name: Logs
    description: |
      Server diagnostic logging inspection, download, runtime severity configuration, and log rotation management (`/v1/logs*`).
      - **Log Inspection & Download (`/v1/logs`)**: Read recent chronological log lines in JSON or download the rolling `slaprf.log` plain-text file (`?format=text`).
      - **Severity & Maintenance (`/v1/logs/config`, `/v1/logs:clear`)**: Inspect or update the active log threshold (`trace`, `debug`, `info`, `warn`, `error`) at runtime without restarting, or truncate `slaprf.log` and rotated backups before reproducing an issue.

  - name: AI Detector & Traces
    description: |
      On-device 1D Temporal ConvNet (TCN) gate-crossing detector, live 2-lap per-timer adapter, Hands-Free Pack Loop recording, `.rfbin` session trace replay, and `.tar.gz` dataset export/import (`/v1/ml*`, `/v1/practice/pack-loop*`, `/v1/practice/sessions/{sessionId}/trace`).

paths:
  /v1/version:
    get:
      tags: [System & State]
      summary: Get server version and build commit
      operationId: getVersion
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /v1/capabilities:
    get:
      tags: [System & State]
      summary: Get runtime capabilities and authentication status
      operationId: getCapabilities
      responses:
        "200":
          description: Server runtime capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /v1/state:
    get:
      tags: [System & State]
      summary: Get complete timing, practice, race, pilot, and track state snapshot
      operationId: getState
      security:
        - basicAuth: []
        - {}
      responses:
        "200":
          description: Full state snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"

  /v1/status:
    get:
      tags: [System & State]
      summary: Get lightweight hardware, gate, and active session status
      operationId: getStatus
      parameters:
        - name: lite
          in: query
          required: false
          description: Pass `1` to omit full `raceState`, `eventState`, and `practiceState` payloads.
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /v1/auth/sessions:
    post:
      tags: [System & State]
      summary: Verify HTTP Basic Auth credentials
      operationId: createAuthSession
      security:
        - basicAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Credentials verified
          headers:
            Location:
              schema:
                type: string
                example: /v1/auth/sessions/current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Invalid password or PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid password or pin"

  /v1/auth/config:
    get:
      tags: [System & State]
      summary: Read Basic Auth configuration singleton
      operationId: getAuthConfig
      security:
        - basicAuth: []
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfigResponse"

    put:
      tags: [System & State]
      summary: Replace HTTP Basic Auth configuration singleton
      operationId: putAuthConfig
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthConfigRequest"
      responses:
        "200":
          description: Updated auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfigResponse"
        "400":
          description: Invalid authentication configuration payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "password must be at least 4 characters when enabled"

  /v1/timing/arm:
    get:
      tags: [Timing Singletons]
      summary: Read global lap-recording armed state singleton
      operationId: getTimingArm
      responses:
        "200":
          description: Armed state
          content:
            application/json:
              schema:
                type: object
                required: [armed]
                properties:
                  armed:
                    type: boolean

    put:
      tags: [Timing Singletons]
      summary: Set global lap-recording armed state singleton
      operationId: putTimingArm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [armed]
              properties:
                armed:
                  type: boolean
      responses:
        "200":
          description: Updated status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          description: Invalid arming payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "expected boolean armed field"

  /v1/timing/mode:
    get:
      tags: [Timing Singletons]
      summary: Read active operating mode singleton (`practice` or `race`)
      operationId: getOperatingMode
      responses:
        "200":
          description: Operating mode
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode:
                    type: string
                    enum: [practice, race]

    put:
      tags: [Timing Singletons]
      summary: Switch operating mode singleton between `practice` and `race`
      operationId: putOperatingMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [practice, race]
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid operating mode (must be practice or race)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "mode must be 'practice' or 'race'"

  /v1/pilots:
    get:
      tags: [Pilots]
      summary: List all pilots in the global directory
      operationId: listPilots
      responses:
        "200":
          description: Pilot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PilotSlot"

    post:
      tags: [Pilots]
      summary: Create a pilot in the global directory
      operationId: createPilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callsign:
                  type: string
                  example: "VORTEX"
                phoneticName:
                  type: string
                  example: "vor-teks"
      responses:
        "201":
          description: Created pilot and updated full state
          headers:
            Location:
              schema:
                type: string
                example: /v1/pilots/11
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid pilot configuration (callsign, band, channel, or thresholds)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "callsign cannot be empty"
        "409":
          description: Duplicate callsign or pilot roster capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "duplicate callsign or capacity conflict"

  /v1/pilots/{slotIndex}:
    parameters:
      - name: slotIndex
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Pilots]
      summary: Get a single pilot by slotIndex
      operationId: getPilot
      responses:
        "200":
          description: Pilot resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotSlot"
        "404":
          description: Pilot slot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "pilot slot not found"

    put:
      tags: [Pilots]
      summary: Replace a pilot slot configuration
      operationId: putPilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotSlot"
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid pilot configuration (callsign, band, channel, or thresholds)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "callsign cannot be empty"
        "404":
          description: Pilot slot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "pilot slot not found"
        "409":
          description: Duplicate callsign or VTX frequency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "duplicate callsign or frequency conflict"

    delete:
      tags: [Pilots]
      summary: Remove a pilot from the directory
      operationId: deletePilot
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "404":
          description: Pilot slot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "pilot slot not found"

  "/v1/pilots:reset":
    post:
      tags: [Pilots]
      summary: Reset the pilot directory to defaults
      operationId: resetPilots
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"

  "/v1/pilots:import":
    post:
      tags: [Pilots]
      summary: Bulk-merge pilots from CSV text or MultiGP entries
      operationId: importPilots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv:
                  type: string
                pilots:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: Updated full state with import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Malformed CSV or JSON pilot import payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid CSV header or frequency value"

  /v1/pilots/export.csv:
    get:
      tags: [Pilots]
      summary: Export the pilot directory as CSV
      operationId: exportPilotsCsv
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /v1/timers:
    get:
      tags: [Timers]
      summary: List detected hardware timers
      operationId: listTimers
      responses:
        "200":
          description: Detected timers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DetectedTimer"

    post:
      tags: [Timers]
      summary: Provision a newly flashed hardware timer
      operationId: createTimer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, timerLabel]
              properties:
                role:
                  type: string
                  enum: [hub, spoke]
                timerLabel:
                  type: string
                  example: "H1"
                fingerprint:
                  type: string
                  example: "A1B2C3D4"
      responses:
        "201":
          description: Provisioned timer and updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid timer parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid timer transport or address"
        "409":
          description: Timer ID already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "timer already exists"

  /v1/timers/{timerId}:
    parameters:
      - name: timerId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Timers]
      summary: Get a detected timer by timerId
      operationId: getTimer
      responses:
        "200":
          description: Detected timer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectedTimer"
        "404":
          description: Timer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "timer not found"

    patch:
      tags: [Timers]
      summary: Update display color for a detected timer
      operationId: patchTimer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color]
              properties:
                color:
                  type: string
                  example: "#34d399"
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
