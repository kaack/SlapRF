name: Release

# Publishes the compiled firmware image and the slaprf-relay LiveTime helper (cmd/slaprf-relay)
# on version tags. The app itself is the static site deployed to https://slaprf.app by pages.yml.
# The relay asset names are linked from web/src/widgets/LiveTimeCard.ts; keep them in sync.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    name: Build firmware
    uses: ./.github/workflows/firmware.yml

  relay:
    name: Build slaprf-relay (${{ matrix.asset }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, asset: slaprf-relay-windows-amd64.exe }
          - { goos: darwin, goarch: arm64, asset: slaprf-relay-macos-arm64 }
          - { goos: darwin, goarch: amd64, asset: slaprf-relay-macos-amd64 }
          - { goos: linux, goarch: amd64, asset: slaprf-relay-linux-amd64 }
          - { goos: linux, goarch: arm64, asset: slaprf-relay-linux-arm64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${{ matrix.asset }}" ./cmd/slaprf-relay

      - name: Upload relay binary
        uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [firmware, relay]
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/firmware

      - name: Download slaprf-relay binaries
        uses: actions/download-artifact@v4
        with:
          pattern: relay-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web/firmware/slaprf-xiao-c5.bin
            dist/slaprf-relay-*
          generate_release_notes: true
