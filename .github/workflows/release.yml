name: Release

# Publishes the compiled ESP32-C5 firmware image and the cross-platform SlapRF Portable
# single-file binaries (cmd/slaprf) on version tags. The hosted browser version is deployed
# to https://slaprf.app by pages.yml.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify build & E2E suite
    uses: ./.github/workflows/verify.yml

  firmware:
    name: Build firmware
    uses: ./.github/workflows/firmware.yml

  web_bundle:
    needs: [verify, firmware]
    name: Build embedded web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/firmware

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build static web + WASM site
        run: |
          go run ./cmd/build-web -web ./web -out ./_site

      - name: Upload built web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  portable:
    needs: [verify, web_bundle]
    name: Build SlapRF Portable (${{ matrix.asset }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, asset: slaprf-windows-amd64.exe }
          - { goos: darwin, goarch: arm64, asset: slaprf-macos-arm64 }
          - { goos: darwin, goarch: amd64, asset: slaprf-macos-amd64 }
          - { goos: linux, goarch: amd64, asset: slaprf-linux-amd64 }
          - { goos: linux, goarch: arm64, asset: slaprf-linux-arm64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundle into cmd/slaprf/site
        uses: actions/download-artifact@v4
        with:
          name: web-site
          path: cmd/slaprf/site

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Compile SlapRF Portable
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${{ matrix.asset }}" ./cmd/slaprf

      - name: Upload Portable binary
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [verify, firmware, portable]
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/firmware

      - name: Download SlapRF Portable binaries
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web/firmware/slaprf-xiao-c5.bin
            dist/slaprf-*
          generate_release_notes: true
