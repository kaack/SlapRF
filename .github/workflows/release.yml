name: Release

# Publishes the compiled ESP32-C5 firmware images (USB `slaprf-xiao-c5.bin` and, when it built,
# the Bluetooth Hub `slaprf-xiao-c5-ble.bin`) and the cross-platform SlapRF Portable
# single-file binaries (cmd/slaprf) on version tags. The hosted browser version is deployed
# to https://slaprf.app by pages.yml.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify build & E2E suite
    uses: ./.github/workflows/verify.yml

  firmware:
    name: Build firmware
    uses: ./.github/workflows/firmware.yml

  web_bundle:
    needs: [verify, firmware]
    name: Build embedded web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/firmware

      - name: Download compiled Bluetooth Hub firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware-ble
          path: web/firmware

      - name: Download compiled PoE Bridge firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware-poe-bridge
          path: web/firmware

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up Hugo Extended
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.170.1 --repo gohugoio/hugo -p "hugo_extended_0.170.1_linux-amd64.tar.gz" -O - | tar -xz -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/hugo" version

      - name: Build static web + WASM site
        run: |
          go run ./cmd/build-web -web ./web -out ./_site

      - name: Upload built web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  portable:
    needs: [verify, web_bundle]
    name: Build SlapRF Portable (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, goos: windows, goarch: amd64, asset: slaprf-windows-amd64.exe }
          - { runner: macos-latest, goos: darwin, goarch: arm64, asset: slaprf-macos-arm64 }
          - { runner: macos-latest, goos: darwin, goarch: amd64, asset: slaprf-macos-amd64 }
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, asset: slaprf-linux-amd64 }
          - { runner: ubuntu-latest, goos: linux, goarch: arm64, asset: slaprf-linux-arm64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundle into cmd/slaprf/site
        uses: actions/download-artifact@v4
        with:
          name: web-site
          path: cmd/slaprf/site

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Compile SlapRF Portable
        run: |
          mkdir -p dist
          go run ./cmd/build-portable -skip-web -goos "${{ matrix.goos }}" -goarch "${{ matrix.goarch }}" -version "${GITHUB_REF_NAME}" -out "dist/${{ matrix.asset }}"

      - name: Verify CoreBluetooth & embedded Info.plist on macOS
        if: matrix.goos == 'darwin'
        run: |
          otool -L "dist/${{ matrix.asset }}" | grep -q "CoreBluetooth.framework"
          otool -P "dist/${{ matrix.asset }}" | grep -q "NSBluetoothAlwaysUsageDescription"

      - name: Upload Portable binary
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  android:
    needs: [verify, web_bundle]
    name: Build SlapRF Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundle into cmd/slaprf-android/site
        uses: actions/download-artifact@v4
        with:
          name: web-site
          path: cmd/slaprf-android/site

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Ensure Android SDK platform 35, build-tools 35.0.0 & NDK
        run: |
          SDK_MGR="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MGR" ]; then
            SDK_MGR="$(find "${ANDROID_SDK_ROOT}" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDK_MGR" --licenses >/dev/null || true
          "$SDK_MGR" "platforms;android-35" "build-tools;35.0.0"
          if [ ! -d "${ANDROID_SDK_ROOT}/ndk" ] || [ -z "$(ls -A "${ANDROID_SDK_ROOT}/ndk" 2>/dev/null)" ]; then
            "$SDK_MGR" "ndk;27.2.12479018"
          fi

      - name: Build signed SlapRF Android APK
        run: |
          rm -rf cmd/slaprf-android/site/wasm cmd/slaprf-android/site/docs
          mkdir -p dist
          VER_CODE="$(echo "${GITHUB_REF_NAME}" | awk -F'[v.]' '{if (NF>=4) print ($2*10000 + $3*100 + $4); else print 6}')"
          go run ./cmd/build-android -skip-web -version "${GITHUB_REF_NAME}" -version-code "${VER_CODE}" -out dist/slaprf-android-arm64.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: portable-slaprf-android-arm64.apk
          path: dist/slaprf-android-arm64.apk
          if-no-files-found: error

  ios:
    needs: [verify, web_bundle]
    name: Build SlapRF iOS / iPadOS IPA (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundle into cmd/slaprf-ios/site
        uses: actions/download-artifact@v4
        with:
          name: web-site
          path: cmd/slaprf-ios/site

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build sideloadable SlapRF iOS / iPadOS IPA
        run: |
          rm -rf cmd/slaprf-ios/site/wasm cmd/slaprf-ios/site/docs cmd/slaprf-ios/site/firmware
          mkdir -p dist
          go run ./cmd/build-ios -skip-web -version "${GITHUB_REF_NAME}" -out dist/slaprf-ios-arm64.ipa

      - name: Verify CoreBluetooth, WebKit & Info.plist inside IPA
        run: |
          VERIFY_DIR="$(mktemp -d)"
          unzip -q dist/slaprf-ios-arm64.ipa -d "$VERIFY_DIR"
          otool -L "$VERIFY_DIR/Payload/SlapRF.app/SlapRF" | grep -q "CoreBluetooth.framework"
          otool -L "$VERIFY_DIR/Payload/SlapRF.app/SlapRF" | grep -q "WebKit.framework"
          plutil -lint "$VERIFY_DIR/Payload/SlapRF.app/Info.plist"
          plutil -p "$VERIFY_DIR/Payload/SlapRF.app/Info.plist" | grep -q "NSBluetoothAlwaysUsageDescription"
          plutil -p "$VERIFY_DIR/Payload/SlapRF.app/Info.plist" | grep -q "NSLocalNetworkUsageDescription"
          plutil -p "$VERIFY_DIR/Payload/SlapRF.app/Info.plist" | grep -q "bluetooth-central"
          rm -rf "$VERIFY_DIR"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: portable-slaprf-ios-arm64.ipa
          path: dist/slaprf-ios-arm64.ipa
          if-no-files-found: error

  release:
    needs: [verify, firmware, portable, android, ios]
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download compiled firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/firmware

      - name: Download compiled Bluetooth Hub firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware-ble
          path: web/firmware

      - name: Download compiled PoE Bridge firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware-poe-bridge
          path: web/firmware

      - name: Download SlapRF Portable binaries
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          merge-multiple: true
          path: dist

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_SRC="docs/releases/${TAG}.md"
          NOTES_OUT="/tmp/release-notes.md"
          PREV_TAG="$(git tag --sort=-v:refname | grep -Fx -A1 "${TAG}" | tail -n 1)"
          if [ "${PREV_TAG}" = "${TAG}" ]; then
            PREV_TAG=""
          fi

          if [ -s "${NOTES_SRC}" ]; then
            cp "${NOTES_SRC}" "${NOTES_OUT}"
          else
            {
              echo "## Changes in ${TAG}"
              echo ""
              if [ -n "${PREV_TAG}" ]; then
                git log "${PREV_TAG}..${TAG}" --no-merges --pretty=format:"- %s (\`%h\`)" | grep -v "\[skip ci\]" || true
              else
                git log -n 20 "${TAG}" --no-merges --pretty=format:"- %s (\`%h\`)" | grep -v "\[skip ci\]" || true
              fi
              echo ""
            } > "${NOTES_OUT}"
          fi

          if [ -n "${PREV_TAG}" ] && ! grep -q "compare/${PREV_TAG}...${TAG}" "${NOTES_OUT}"; then
            {
              echo ""
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            } >> "${NOTES_OUT}"
          fi
          cat "${NOTES_OUT}"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          files: |
            web/firmware/slaprf-xiao-c5.bin
            web/firmware/slaprf-xiao-c5-ble.bin
            web/firmware/slaprf-p4-poe-bridge.bin
            dist/slaprf-*
          fail_on_unmatched_files: true
