name: Build & Deploy GitHub Page

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "github-page"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build & E2E suite
    uses: ./.github/workflows/verify.yml

  firmware:
    name: Build firmware
    uses: ./.github/workflows/firmware.yml

  build-github-page:
    needs: [verify, firmware]
    name: Build & Push SPA to github-page branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Set up Hugo Extended
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.170.1 --repo gohugoio/hugo -p "hugo_extended_0.170.1_linux-amd64.tar.gz" -O - | tar -xz -C "$HOME/.local/bin" hugo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/hugo" version

      - name: Download compiled firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/firmware

      - name: Download compiled Bluetooth Hub firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware-ble
          path: web/firmware

      - name: Download compiled PoE Bridge firmware image
        uses: actions/download-artifact@v4
        with:
          name: firmware-poe-bridge
          path: web/firmware

      - name: Resolve latest iOS IPA release metadata for altstore-source.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if REL_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null)"; then
            IPA_URL="$(echo "$REL_JSON" | jq -r '.assets[] | select(.name == "slaprf-ios-arm64.ipa") | .browser_download_url' | head -n 1)"
            IPA_SIZE="$(echo "$REL_JSON" | jq -r '.assets[] | select(.name == "slaprf-ios-arm64.ipa") | .size' | head -n 1)"
            REL_TAG="$(echo "$REL_JSON" | jq -r '.tag_name // empty')"
            REL_DATE="$(echo "$REL_JSON" | jq -r '.published_at // empty')"
            if [ -n "$IPA_URL" ] && [ -n "$REL_TAG" ]; then
              echo "SLAPRF_ALTSTORE_VERSION=${REL_TAG}" >> "$GITHUB_ENV"
              echo "SLAPRF_ALTSTORE_DOWNLOAD_URL=${IPA_URL}" >> "$GITHUB_ENV"
              [ -n "$IPA_SIZE" ] && echo "SLAPRF_ALTSTORE_SIZE=${IPA_SIZE}" >> "$GITHUB_ENV" || true
              [ -n "$REL_DATE" ] && echo "SLAPRF_ALTSTORE_DATE=${REL_DATE}" >> "$GITHUB_ENV" || true
            fi
          fi

      - name: Build static SPA and Go WASM simulation engine
        run: go run ./cmd/build-web -web ./web -out ./_site

      - name: Deploy static files to github-page branch
        run: |
          WORKTREE_DIR="$(mktemp -d)"
          for i in 1 2 3; do
            git fetch origin github-page && break || sleep 5
          done
          if git show-ref --verify --quiet refs/remotes/origin/github-page; then
            git worktree add -B github-page "$WORKTREE_DIR" origin/github-page
          else
            git worktree add --detach "$WORKTREE_DIR"
            git -C "$WORKTREE_DIR" checkout --orphan github-page
            git -C "$WORKTREE_DIR" rm -rf . || true
          fi

          rm -rf "$WORKTREE_DIR/docs"
          mkdir -p "$WORKTREE_DIR/docs"
          cp -r ./_site/. "$WORKTREE_DIR/docs/"

          printf '## SlapRF (GitHub Page)\n\nThis branch holds the static files for hosting the application as a GitHub Page.\n' > "$WORKTREE_DIR/README.md"
          printf '.idea\n*.iml\n.DS_Store\n' > "$WORKTREE_DIR/.gitignore"

          cd "$WORKTREE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit on github-page branch."
          else
            VERSION="${GITHUB_REF_NAME:-main} (${GITHUB_SHA::7})"
            git commit -m "Build GitHub Page for ${VERSION}"
            for i in 1 2 3; do
              git push origin github-page --force && break || sleep 5
            done
          fi
