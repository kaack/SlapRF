name: PHY Symbol Survey

# Lists the ESP32-C5 PHY / RF-test library symbols the 5.8 GHz capture driver relies on, as
# workflow annotations (readable without downloading logs). Runs when this file changes.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phy-symbols.yml"
  workflow_dispatch:

jobs:
  survey:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - name: List PHY symbols
        shell: bash
        run: |
          NM=$(find / -name 'riscv32-esp-elf-nm' -type f 2>/dev/null | head -1)
          echo "::notice title=nm::${NM:-not found}"
          IDF=${IDF_PATH:-/opt/esp/idf}
          LIBDIR=$(dirname "$(find "$IDF/components/esp_phy" -path "*esp32c5*" -name libphy.a | head -1)")
          echo "::notice title=libdir::$LIBDIR :: $(ls "$LIBDIR" | xargs)"
          for lib in "$LIBDIR"/*.a; do
            name=$(basename "$lib")
            syms=$("$NM" -g --defined-only "$lib" 2>/dev/null | awk 'NF==3 {print $3}' |
              grep -Ei 'xpd|pbus|chanfreq|rf_freq|force_rx|adctrig|rfpll|set_chan|tx_on|tx_off|rx_on|rxclk|freq_mem|ckgen|phy_param|restart_cal|i2c_sdm|set_freq|sigrssi|get_rssi|noise_floor|11p' | sort -u | xargs || true)
            if [ -n "$syms" ]; then echo "::notice title=$name::$syms"; fi
          done
          for s in phy_enter_critical phy_exit_critical phy_pbus_xpd_tx_on phy_pbus_xpd_tx_off phy_pbus_workmode adctrig force_rx_gain cmd_parse phy_set_chanfreq phy_set_rf_freq_offset; do
            hits=$("$NM" -A "$LIBDIR"/*.a 2>/dev/null | awk -v s="$s" '$NF==s' | sed 's#.*/##' | xargs || true)
            echo "::notice title=def $s::$hits"
          done
          exit 0
