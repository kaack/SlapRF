<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>SlapRF</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0c0f;
      color: #f3f5f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    .slaprf-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 44%, rgba(212, 255, 58, 0.08) 0%, rgba(56, 189, 248, 0.04) 36%, transparent 68%),
        #0b0c0f;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s ease;
    }
    .slaprf-boot-loader.is-ready {
      opacity: 0;
      transform: scale(1.02);
      visibility: hidden;
      pointer-events: none;
    }
    .slaprf-boot-card {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    .slaprf-boot-radar {
      position: relative;
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
    }
    .slaprf-boot-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(212, 255, 58, 0.28);
      animation: slaprfPulseRing 2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .slaprf-boot-ring.is-second {
      animation-delay: 0.9s;
    }
    .slaprf-boot-sweep {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #d4ff3a;
      border-right-color: rgba(212, 255, 58, 0.35);
      animation: slaprfSpin 1.15s linear infinite;
    }
    .slaprf-boot-logo {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: #14171c;
      border: 1px solid #2b313d;
      display: grid;
      place-items: center;
      color: #d4ff3a;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    .slaprf-boot-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f3f5f8;
    }
    .slaprf-boot-sub {
      font-size: 12px;
      color: #8b93a4;
      margin-top: -10px;
    }
    .slaprf-boot-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: #1a1e26;
      border: 1px solid #252a34;
      overflow: hidden;
      position: relative;
    }
    .slaprf-boot-fill {
      height: 100%;
      width: 14%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #d4ff3a);
      transition: width 0.18s ease;
    }
    .slaprf-boot-status {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #b4bccb;
      min-height: 18px;
    }
    @keyframes slaprfSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes slaprfPulseRing {
      0% { transform: scale(0.78); opacity: 0.85; }
      100% { transform: scale(1.38); opacity: 0; }
    }
  </style>
  <link rel="stylesheet" href="./styles/tokens.css?v=159" />
  <link rel="stylesheet" href="./styles/base.css?v=159" />
  <link rel="stylesheet" href="./styles/layout.css?v=159" />
  <link rel="stylesheet" href="./styles/components.css?v=161" />
  <link rel="stylesheet" href="./styles/views.css?v=170" />
</head>
<body>
  <div id="slaprf-boot-loader" class="slaprf-boot-loader" role="status" aria-live="polite">
    <div class="slaprf-boot-card">
      <div class="slaprf-boot-radar" aria-hidden="true">
        <span class="slaprf-boot-ring"></span>
        <span class="slaprf-boot-ring is-second"></span>
        <span class="slaprf-boot-sweep"></span>
        <span class="slaprf-boot-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0.6 -1.1)">
            <path d="M18.21 16.30A8.2 8.2 0 1 1 13.30 5.79" />
            <circle cx="10.5" cy="13.5" r="1.8" fill="currentColor" stroke="none" />
            <path d="M10.5 13.5L15.2 9.8" />
            <path d="M15.77 7.22A8.2 8.2 0 0 1 18.70 13.50" />
            <path d="M17.64 4.36A11.6 11.6 0 0 1 22.09 13.90" opacity="0.65" />
          </g></svg>
        </span>
      </div>
      <div class="slaprf-boot-title">SlapRF</div>
      <div class="slaprf-boot-sub">5.8 GHz Multi-Gate Sector Timer</div>
      <div class="slaprf-boot-bar">
        <div id="slaprf-boot-fill" class="slaprf-boot-fill"></div>
      </div>
      <div id="slaprf-boot-status" class="slaprf-boot-status">Loading application bundle…</div>
    </div>
  </div>
  <div id="app" class="app"></div>
  <!-- Bundled from web/src/main.ts by Go's native esbuild library (zero Node.js). -->
  <script src="./dist/app.js?v=182"></script>
</body>
</html>
