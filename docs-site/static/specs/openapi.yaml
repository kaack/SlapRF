        crossingId:
          type: integer
          example: 104
        offsetMs:
          type: integer
          example: -150
        penaltySec:
          type: number
          example: 2.0
        orderedSlotIndices:
          type: array
          items:
            type: integer
            example: 1

    StatusResponse:
      type: object
      required: [serverTimestampUs, timingHardwareMode, gates, timers, simulatorRunning, raceArmed]
