openapi: 3.1.0
info:
  title: SlapRF Timing & Race Management REST API
  version: 1.0.0
  summary: Versioned HTTP REST API (`/v1`) exposed by SlapRF Portable and the SlapRF Android LAN host.
  description: |
    SlapRF exposes a resource-oriented JSON REST API under `/v1` on `http://127.0.0.1:8090` (or `http://<host-ip>:8090` when started with `-lan`) for querying and managing live track telemetry, pilot directories, practice sessions, race tournament sessions, hardware transports, and database backups.

    ### REST Design Principles
    - **Resource CRUD & HTTP Status Codes**:
      - `GET`: Read collections, items, or singletons (`200 OK`, `404 Not Found`).
      - `POST` on collections: Create resources (`201 Created` with `Location` header, `409 Conflict`).
      - `PUT`: Idempotent full replacement of an item or singleton (`200 OK`, `404 Not Found`, `409 Conflict`).
      - `PATCH`: Partial attribute update of an item or singleton (`200 OK`, `404 Not Found`, `409 Conflict`).
      - `DELETE`: Remove an item from a collection (`200 OK`, `404 Not Found`, `409 Conflict`).
      - Unsupported HTTP methods return `405 Method Not Allowed` with an `Allow` header.
    - **Singletons & `:action` Custom Methods (AIP-136 / AIP-156)**:
      - Singletons (`/v1/storage`, `/v1/track`, `/v1/timing/rules`, `/v1/timing/arm`, `/v1/timing/mode`, `/v1/hardware/mode`, `/v1/sim`, `/v1/laprf-emulator`, `/v1/auth/config`) always exist and never accept `DELETE`.
      - Imperative operations use `POST ...:<action>` (for example, `/v1/storage:reset`, `/v1/track:reset`, `/v1/practice/sessions/{sessionId}:start`, and `/v1/race/sessions/{sessionId}:pause`).
  license:
    name: MIT
    url: https://github.com/kaack/SlapRF
servers:
  - url: http://localhost:8090
    description: Local SlapRF Portable server (default)
  - url: http://{host}:{port}
    description: LAN SlapRF server (started with -lan)
    variables:
      host:
        default: 192.168.1.50
      port:
        default: "8090"
tags:
  - name: System & State
    description: |
      Core bootstrap, feature discovery, authentication, and live engine snapshot endpoints.
      - **Bootstrap & Polling**: Use `GET /v1/state` on initial client load to hydrate full state, and `GET /v1/status?lite=1` for lightweight heartbeats when WebSocket streaming is unavailable.
      - **Security**: `GET /v1/capabilities` is always accessible unauthenticated and reports `authRequired` and `authenticated` flags; manage HTTP Basic Auth via `/v1/auth/config` and verify credentials via `POST /v1/auth/sessions`.

  - name: Timing Singletons
    description: |
      Singleton resources controlling the active timing engine's detection filters and mode.
      - **Hysteresis & Lap Filters (`/v1/timing/rules`)**: Configure `minCrossingMs`, `minLapSeconds`, `maxLapSeconds`, `confirmationWindowMs`, and holeshot rules.
      - **Arming & Mode (`/v1/timing/arm`, `/v1/timing/mode`)**: Arm or disarm global lap recording and switch between `practice` and `race` operating modes.

  - name: Pilots
    description: |
      Global 16-slot pilot roster shared across practice sessions and tournament brackets.
      - **CRUD & Unique Constraints**: Create pilots with `POST /v1/pilots` (`201 Created` + `Location` header) and update callsign, phonetic TTS name, VTX band/channel, or per-pilot thresholds via `PUT /v1/pilots/{slotIndex}`.
      - **Bulk Import & Export**: Merge pilots from CSV or MultiGP entries via `POST /v1/pilots:import` and export the roster via `GET /v1/pilots/export.csv`.

  - name: Track & Timers
    description: |
      Course layout (`START_FINISH` and `SECTOR_GATE` checkpoints), detected receiver hardware bindings, and per-gate / per-pilot rule overrides.
      - **Gates (`/v1/track/gates`)**: Add, reorder, or delete course gates and bind each gate to a `timerId`, `enterThreshold`, and `exitThreshold`.
      - **Granular Rule Overrides**: Override global timing filters for an entire gate (`/v1/track/gates/{gateId}/rules`) or for a specific pilot at a specific gate (`/v1/track/gates/{gateId}/pilots/{slotIndex}/rules`).

  - name: Practice Sessions
    description: |
      Multi-session open practice management with independent pilot channel assignments and lap history.
      - **Session Addressing**: Pass an explicit `sessionId` or the literal alias `current` to target the currently selected practice session.
      - **Lifecycle Actions**: Transition sessions with `:start`, `:pause`, `:resume`, `:stop`, and `:clearLaps`, and validate or invalidate individual laps via `PATCH .../laps/{lapId}` or `POST .../laps/{lapId}:toggle`.

  - name: Race Sessions
    description: |
      Full tournament race control covering qualifying rounds, double-elimination / multi-stage DAG brackets, Open Qualifier (ZippyQ), marshal overrides, and MultiGP RaceSync integration.
      - **Lifecycle & Heat Control**: Drive session state (`:start`, `:pause`, `:resume`, `:stop`, `:complete`, `:scrap`, `:reopen`), stage progression (`stages/{stageRef}:control`, `:advance`), and live heat horns/clocks (`heats/{heatId}:control`).
      - **Marshal & MultiGP Sync**: Apply lap toggles, time penalties, or seat reorders via `pilots/{slotIndex}:marshal`, import MultiGP chapters via `sessions:importMultiGP`, and push results through `/v1/race/multigp/proxy/{subPath}`.

  - name: Hardware & LapRF Emulator
    description: |
      Physical timing hardware transports and the built-in ImmersionRC LapRF 8-Way TCP `:5403` protocol emulator.
      - **SlapRF USB (`/v1/slaprf/usb/*`)**: Enumerate USB-C serial ports, connect Hub `H1` or standalone timers, run `5.8 GHz` Raceband spectrum surveys (`/v1/slaprf/usb/survey`), and send console commands (`/v1/slaprf/usb:command`).
      - **SlapRF Bluetooth (`/v1/slaprf/bluetooth/*`)**: Discover wireless SlapRF Bluetooth Hubs (`ble:<FP>`), pair/connect/cancel or forget wireless Hubs (`/v1/slaprf/bluetooth/connections*`), run Raceband surveys (`/v1/slaprf/bluetooth/survey`), and send console commands (`/v1/slaprf/bluetooth:command`).
      - **External Hardware & Relay (`/v1/laprf/*`, `/v1/rotorhazard/*`, `/v1/laprf-emulator`)**: Discover and connect to LapRF 8-Way pucks or RotorHazard servers/USB nodes on the LAN (`network/devices`) or over USB (`usb/ports`), manage active connections (`connections`), or expose SlapRF crossings to third-party race software on TCP `:5403`.

  - name: Simulator
    description: |
      Full-fidelity physics, RF RSSI, hardware, and MultiGP RaceSync simulation engine for offline testing, demos, and marshal training.
      - **Flight & Pit Simulation (`/v1/sim`, `/v1/sim/pilots/{slotIndex}:action`)**: Control simulator speed, track-walker marshals, synchronized 6S pack bursts (`:packBurst`), and individual pilot events (`crash`, `recover`, `pit`, `break`, `refill-launch`).
      - **Virtual Hardware & MultiGP (`/v1/sim/timers`, `/v1/sim/laprf/*`, `/v1/sim/rh/*`, `/v1/sim/mgp*`)**: Hot-plug virtual Hub USB cables, flash/erase simulated ESP32-C5 boards, scan simulated spectrum sweeps, and test full MultiGP WebService `v1.0.4` workflows offline.

  - name: Storage
    description: |
      Database inspection, JSON backup/restore, and showcase dataset management for both real-hardware and simulator workspaces.
      - **Real & Simulator Snapshots**: Export or restore real-hardware state via `/v1/storage` and simulator state via `/v1/storage/sim`.
      - **Maintenance Actions**: Check `bbolt` file size and record counts via `GET /v1/storage/status`, seed the showcase event via `POST /v1/storage:restoreDemo`, or wipe back to clean defaults via `POST /v1/storage:reset`.

paths:
  /v1/version:
    get:
      tags: [System & State]
      summary: Get server version and build commit
      operationId: getVersion
      responses:
        "200":
          description: Version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /v1/capabilities:
    get:
      tags: [System & State]
      summary: Get runtime capabilities and authentication status
      operationId: getCapabilities
      responses:
        "200":
          description: Server runtime capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /v1/state:
    get:
      tags: [System & State]
      summary: Get complete timing, practice, race, pilot, and track state snapshot
      operationId: getState
      security:
        - basicAuth: []
        - {}
      responses:
        "200":
          description: Full state snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"

  /v1/status:
    get:
      tags: [System & State]
      summary: Get lightweight hardware, gate, and active session status
      operationId: getStatus
      parameters:
        - name: lite
          in: query
          required: false
          description: Pass `1` to omit full `raceState`, `eventState`, and `practiceState` payloads.
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: Status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /v1/auth/sessions:
    post:
      tags: [System & State]
      summary: Verify HTTP Basic Auth credentials
      operationId: createAuthSession
      security:
        - basicAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Credentials verified
          headers:
            Location:
              schema:
                type: string
                example: /v1/auth/sessions/current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Invalid password or PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid password or pin"

  /v1/auth/config:
    get:
      tags: [System & State]
      summary: Read Basic Auth configuration singleton
      operationId: getAuthConfig
      security:
        - basicAuth: []
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfigResponse"

    put:
      tags: [System & State]
      summary: Replace HTTP Basic Auth configuration singleton
      operationId: putAuthConfig
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthConfigRequest"
      responses:
        "200":
          description: Updated auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfigResponse"
        "400":
          description: Invalid authentication configuration payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "password must be at least 4 characters when enabled"

  /v1/timing/rules:
    get:
      tags: [Timing Singletons]
      summary: Read global timing detection rules singleton
      operationId: getTimingRules
      responses:
        "200":
          description: Current global timing rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingRules"

    put:
      tags: [Timing Singletons]
      summary: Replace global timing detection rules singleton
      operationId: putTimingRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimingRules"
      responses:
        "200":
          description: Clamped and applied global timing rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimingRules"
        "400":
          description: Invalid timing rules payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "minLapTimeMs must be non-negative"

  /v1/timing/arm:
    get:
      tags: [Timing Singletons]
      summary: Read global lap-recording armed state singleton
      operationId: getTimingArm
      responses:
        "200":
          description: Armed state
          content:
            application/json:
              schema:
                type: object
                required: [armed]
                properties:
                  armed:
                    type: boolean

    put:
      tags: [Timing Singletons]
      summary: Set global lap-recording armed state singleton
      operationId: putTimingArm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [armed]
              properties:
                armed:
                  type: boolean
      responses:
        "200":
          description: Updated status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          description: Invalid arming payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "expected boolean armed field"

  /v1/timing/mode:
    get:
      tags: [Timing Singletons]
      summary: Read active operating mode singleton (`practice` or `race`)
      operationId: getOperatingMode
      responses:
        "200":
          description: Operating mode
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode:
                    type: string
                    enum: [practice, race]

    put:
      tags: [Timing Singletons]
      summary: Switch operating mode singleton between `practice` and `race`
      operationId: putOperatingMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [practice, race]
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid operating mode (must be practice or race)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "mode must be 'practice' or 'race'"

  /v1/pilots:
    get:
      tags: [Pilots]
      summary: List all pilots in the global directory
      operationId: listPilots
      responses:
        "200":
          description: Pilot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PilotSlot"

    post:
      tags: [Pilots]
      summary: Create a pilot in the global directory
      operationId: createPilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callsign:
                  type: string
                  example: "VORTEX"
                phoneticName:
                  type: string
                  example: "vor-teks"
      responses:
        "201":
          description: Created pilot and updated full state
          headers:
            Location:
              schema:
                type: string
                example: /v1/pilots/11
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid pilot configuration (callsign, band, channel, or thresholds)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "callsign cannot be empty"
        "409":
          description: Duplicate callsign or pilot roster capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "duplicate callsign or capacity conflict"

  /v1/pilots/{slotIndex}:
    parameters:
      - name: slotIndex
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Pilots]
      summary: Get a single pilot by slotIndex
      operationId: getPilot
      responses:
        "200":
          description: Pilot resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotSlot"
        "404":
          description: Pilot slot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "pilot slot not found"

    put:
      tags: [Pilots]
      summary: Replace a pilot slot configuration
      operationId: putPilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotSlot"
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid pilot configuration (callsign, band, channel, or thresholds)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "callsign cannot be empty"
        "404":
          description: Pilot slot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "pilot slot not found"
        "409":
          description: Duplicate callsign or VTX frequency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "duplicate callsign or frequency conflict"

    delete:
      tags: [Pilots]
      summary: Remove a pilot from the directory
      operationId: deletePilot
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "404":
          description: Pilot slot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "pilot slot not found"

  "/v1/pilots:reset":
    post:
      tags: [Pilots]
      summary: Reset the pilot directory to defaults
      operationId: resetPilots
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"

  "/v1/pilots:import":
    post:
      tags: [Pilots]
      summary: Bulk-merge pilots from CSV text or MultiGP entries
      operationId: importPilots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv:
                  type: string
                pilots:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: Updated full state with import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Malformed CSV or JSON pilot import payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid CSV header or frequency value"

  /v1/pilots/export.csv:
    get:
      tags: [Pilots]
      summary: Export the pilot directory as CSV
      operationId: exportPilotsCsv
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /v1/track:
    get:
      tags: [Track & Timers]
      summary: Read course track singleton (gates and timers)
      operationId: getTrack
      responses:
        "200":
          description: Track gates and detected timers
          content:
            application/json:
              schema:
                type: object
                properties:
                  gates:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrackGate"
                  timers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DetectedTimer"

  "/v1/track:reset":
    post:
      tags: [Track & Timers]
      summary: Reset course track topology to preset or default layout
      operationId: resetTrack
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                preset:
                  type: string
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"

  /v1/track/thresholds:
    put:
      tags: [Track & Timers]
      summary: Apply batch per-gate, per-pilot enter/exit RSSI thresholds
      operationId: putTrackThresholds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GateThresholdUpdate"
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid track threshold parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "enterThreshold must be greater than exitThreshold"

  /v1/track/gates:
    get:
      tags: [Track & Timers]
      summary: List all course gates
      operationId: listTrackGates
      responses:
        "200":
          description: Gate list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackGate"

    post:
      tags: [Track & Timers]
      summary: Create a gate node on the course track
      operationId: createTrackGate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Split 1"
                assignedTimerId:
                  type: integer
                  example: 2
                trackOrder:
                  type: integer
                  example: 1
      responses:
        "201":
          description: Created gate and updated full state
          headers:
            Location:
              schema:
                type: string
                example: /v1/track/gates/5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid gate configuration or threshold parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid gate type or threshold range"

  /v1/track/gates/{gateId}:
    parameters:
      - name: gateId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Track & Timers]
      summary: Get a single track gate
      operationId: getTrackGate
      responses:
        "200":
          description: Track gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackGate"
        "404":
          description: Gate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "gate not found"

    put:
      tags: [Track & Timers]
      summary: Replace a track gate (name, role, order, or assigned timer)
      operationId: putTrackGate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateUpdate"
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid gate configuration or threshold parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid gate type or threshold range"
        "404":
          description: Gate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "gate not found"

    patch:
      tags: [Track & Timers]
      summary: Partially update a track gate
      operationId: patchTrackGate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateUpdate"
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid gate configuration or threshold parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid gate type or threshold range"
        "404":
          description: Gate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "gate not found"

    delete:
      tags: [Track & Timers]
      summary: Remove a gate from the track
      operationId: deleteTrackGate
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "404":
          description: Gate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "gate not found"

  /v1/track/gates/{gateId}/rules:
    parameters:
      - name: gateId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Track & Timers]
      summary: Read per-gate timing rule overrides singleton
      operationId: getGateRules
      responses:
        "200":
          description: Per-gate rule overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateRuleOverrides"
        "404":
          description: Gate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "gate not found"

    put:
      tags: [Track & Timers]
      summary: Replace per-gate timing rule overrides singleton
      operationId: putGateRules
      requestBody:
        required: true
        content:
