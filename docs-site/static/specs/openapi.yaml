              $ref: "#/components/schemas/SimMultiGPAdminAction"
      responses:
        "200":
          description: Updated simulated MultiGP chapter state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimMultiGPState"
        "400":
          description: Invalid MultiGP admin action or parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "pilot callsign is required"

  /v1/sim/mgp/{subPath}:
    parameters:
      - name: subPath
        in: path
        required: true
        description: Simulated MultiGP WebService v1.0.4 path (`chapter/findChapterFromApiKey`, `race/listForChapter`, `pilot/listForChapter`, `race/view`, `race/getAdditionalRounds`, `race/assignSlot`, `race/captureOverallRaceResult`).
        schema:
          type: string
    post:
      tags: [Simulator]
      summary: Invoke an in-memory simulated MultiGP WebService v1.0.4 POST endpoint
      operationId: postSimMultiGPWebService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey:
                  type: string
                  example: "MGP-SIM-BAYAREA-2026"
                data:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Simulated MultiGP WebService response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  chapterId:
                    type: integer
                    example: 1042
                  chapterName:
                    type: string
                    example: "Bay Area FPV"
        "400":
          description: Invalid JSON request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  statusDescription:
                    type: string
                    example: "Invalid JSON request body"
        "401":
          description: Invalid simulated MultiGP Chapter API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  statusDescription:
                    type: string
                    example: "Invalid MultiGP Chapter API key"
    put:
      tags: [Simulator]
      summary: Invoke an in-memory simulated MultiGP WebService v1.0.4 PUT endpoint
      operationId: putSimMultiGPWebService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey]
              properties:
                apiKey:
                  type: string
                  example: "MGP-SIM-BAYAREA-2026"
                data:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Simulated MultiGP WebService response envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        "400":
          description: Invalid JSON request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  statusDescription:
                    type: string
                    example: "Invalid JSON request body"
        "401":
          description: Invalid simulated MultiGP Chapter API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  statusDescription:
                    type: string
                    example: "Invalid MultiGP Chapter API key"

  /v1/storage/status:
    get:
      tags: [Storage]
      summary: Read bbolt database file size, record counts, and last backup timestamp
      operationId: getStorageStatus
      responses:
        "200":
          description: Storage status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/storage:
    get:
      tags: [Storage]
      summary: Export the complete persisted real-hardware database singleton as JSON
      operationId: getStorage
      responses:
        "200":
          description: Full persisted engine backup JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

    put:
      tags: [Storage]
      summary: Restore real-hardware database singleton state from a JSON backup
      operationId: putStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Restored full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"
        "400":
          description: Invalid storage snapshot payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "malformed storage snapshot JSON"

  "/v1/storage:reset":
    post:
      tags: [Storage]
      summary: Wipe database storage back to clean defaults
      operationId: resetStorage
      responses:
        "200":
          description: Reset full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"

  "/v1/storage:restoreDemo":
    post:
      tags: [Storage]
      summary: Populate active engine with the showcase demo dataset
      operationId: restoreDemoStorage
      responses:
        "200":
          description: Updated full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullStateResponse"

  "/v1/storage:recordBackup":
    post:
      tags: [Storage]
      summary: Record the latest backup export timestamp on the server
      operationId: recordStorageBackup
      responses:
        "200":
          description: Updated storage status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/storage/sim:
    get:
      tags: [Storage]
      summary: Export persisted simulator state singleton as JSON
      operationId: getSimStorage
      responses:
        "200":
          description: Persisted simulator state JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

    put:
      tags: [Storage]
      summary: Restore persisted simulator state singleton from JSON
      operationId: putSimStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Restored simulator state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid simulator parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid simulator pilot speed or noise level"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Optional HTTP Basic Auth when enabled in Settings -> Security.

  responses:
    BadRequestError:
      description: Malformed JSON body, invalid parameter, or failed validation rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "invalid request payload"
    UnauthorizedError:
      description: Missing or invalid HTTP Basic Auth credentials when server authentication is enabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "authentication required"
    NotFoundError:
      description: Requested resource item does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "resource not found"
    ConflictError:
      description: Resource state conflict (duplicate name/callsign, active session/heat lock, or minimum capacity rule).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "conflict with current resource state"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message explaining why the request was rejected.
          example: "pilot callsign \"VORTEX\" already exists"

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    VersionResponse:
      type: object
      properties:
        release_tag:
          type: string
          example: "v0.1.6"
        commit_hash:
          type: string
          example: "24ebcc1"
        branch_name:
          type: string
          example: "main"

    CapabilitiesResponse:
      type: object
      properties:
        portable:
          type: boolean
          example: true
        version:
          type: string
          example: "v0.1.6"
        hostname:
          type: string
          example: "race-director-pc"
        storageBackend:
          type: string
          example: "bbolt"
        nativeEngine:
          type: boolean
          example: true
        nativeUsb:
          type: boolean
          example: true
        laprfEmulator:
          type: boolean
          example: true
        laprfClient:
          type: boolean
          example: true
        rotorhazardDiscover:
          type: boolean
          example: true
        multigpProxy:
          type: boolean
          example: true
        authRequired:
          type: boolean
          example: false
        authenticated:
          type: boolean
          example: true
        lanIPs:
          type: array
          items:
            type: string
            example: "192.168.1.50"

    AuthConfigResponse:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        username:
          type: string
          example: "admin"
        hasPassword:
          type: boolean
          example: false

    AuthConfigRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          example: true
        username:
          type: string
          example: "admin"
        password:
          type: string
          example: "race-control-2026"

    TimingHardwareMode:
      type: string
      enum: [slaprf, slaprf_ble, laprf, laprf_usb, rotorhazard, rotorhazard_usb]
      example: slaprf

    TimerRole:
      type: string
      enum: [START_FINISH, SECTOR_GATE]
      example: START_FINISH

    SectorBadge:
      type: string
      enum: [OVERALL_BEST, PERSONAL_BEST, NORMAL, OFF_PACE]
      example: PERSONAL_BEST

    PilotSlot:
      type: object
      required: [slotIndex, callsign, enabled, band, channel, frequencyMhz]
      properties:
        slotIndex:
          type: integer
          minimum: 1
          maximum: 64
          example: 1
        callsign:
          type: string
          example: "VORTEX"
        phoneticName:
          type: string
          example: "vor-teks"
        enabled:
          type: boolean
          example: true
        band:
          type: integer
          description: "1 = Raceband (R1-R8)"
          example: 1
        channel:
          type: integer
          minimum: 0
          maximum: 8
          example: 1
        frequencyMhz:
          type: integer
          example: 5658
        enterThreshold:
          type: number
          example: -58
        exitThreshold:
          type: number
          example: -68
        color:
          type: string
          example: "#d4ff3a"
        mgpPilotId:
          type: integer
          example: 48210
        mgpUserName:
          type: string
          example: "VortexFPV"

    DetectedTimer:
      type: object
      required: [timerId, timerLabel, isHub, online]
      properties:
        timerId:
          type: integer
          example: 1
        timerLabel:
          type: string
          example: "H1"
        color:
          type: string
          example: "#d4ff3a"
        isHub:
          type: boolean
          example: true
        firmwareVersion:
          type: string
          example: "v0.1.6"
        fingerprint:
          type: string
          example: "A1B2C3D4"
        batteryMv:
          type: integer
          example: 4150
        batteryPct:
          type: integer
          example: 94
        noiseFloorDbm:
          type: number
          example: -94.5
        lastRssi:
          type: array
          items:
            type: number
            example: -92.0
        framesRxCount:
          type: integer
          example: 14820
        online:
          type: boolean
          example: true
        lastSeenAt:
          type: string
          example: "2026-11-20T21:15:00Z"

    TrackGate:
      type: object
      required: [gateId, assignedTimerId, name, role, trackOrder, online]
      properties:
        gateId:
          type: integer
          example: 1
        assignedTimerId:
          type: integer
          example: 1
        timerLabel:
          type: string
          example: "H1"
        firmwareVersion:
          type: string
          example: "v0.1.6"
        name:
          type: string
          example: "Start / Finish"
        color:
          type: string
          example: "#d4ff3a"
        role:
          $ref: "#/components/schemas/TimerRole"
        trackOrder:
          type: integer
          example: 0
        batteryMv:
          type: integer
          example: 4150
        batteryPct:
          type: integer
          example: 94
        noiseFloorDbm:
          type: number
          example: -94.5
        lastRssi:
          type: array
          items:
            type: number
            example: -92.0
        enterThresholds:
          type: array
          items:
            type: number
            example: -58.0
        exitThresholds:
          type: array
          items:
            type: number
            example: -68.0
        ruleOverrides:
          $ref: "#/components/schemas/GateRuleOverrides"
        online:
          type: boolean
          example: true
        framesRxCount:
          type: integer
          example: 14820

    GateUpdate:
      type: object
      properties:
        gateId:
          type: integer
          example: 2
        name:
          type: string
          example: "Split 1"
        color:
          type: string
          example: "#38bdf8"
        role:
          $ref: "#/components/schemas/TimerRole"
        trackOrder:
          type: integer
          example: 1
        assignedTimerId:
          type: integer
          example: 2

    GateThresholdUpdate:
      type: object
      required: [gateId, slotIndex, enterDbm]
      properties:
        gateId:
          type: integer
          example: 1
        slotIndex:
          type: integer
          example: 1
        enterDbm:
          type: number
          example: -56.0
        exitDbm:
          type: number
          example: -66.0
        auto:
          type: boolean
          example: false

    TimingRules:
      type: object
      properties:
        minLapSec:
          type: number
          example: 5.0
        maxLapSec:
          type: number
          example: 120.0
        minCrossingSec:
          type: number
          example: 0.12
        beepOnCross:
          type: boolean
          example: false

    GateRuleOverrides:
      type: object
      properties:
        minLapSec:
          type: number
          example: 5.0
        maxLapSec:
          type: number
          example: 120.0
        minCrossingSec:
          type: number
          example: 0.12
        beepOnCross:
          type: boolean
          example: true

    GateCrossingEvent:
      type: object
      required: [eventId, gateId, gateName, isStartFinish, slotIndex, callsign, frequencyMhz, timestampUs, peakRssiDbm]
      properties:
        eventId:
          type: integer
          example: 104
        gateId:
          type: integer
          example: 1
        gateName:
          type: string
          example: "Start / Finish"
        isStartFinish:
          type: boolean
          example: true
        startedLap:
          type: boolean
          example: false
        slotIndex:
          type: integer
          example: 1
        callsign:
          type: string
          example: "VORTEX"
        frequencyMhz:
          type: integer
          example: 5658
        timestampUs:
          type: integer
          example: 48219400
        peakRssiDbm:
          type: number
          example: -46.5
        beamwidthMs:
          type: number
          example: 310
        estimatedSpeedMph:
          type: number
          example: 41.2
        passingNumber:
          type: integer
          example: 12

    FilteredDetection:
      type: object
      properties:
        timestampUs:
          type: integer
          example: 49102000
        gateId:
          type: integer
          example: 1
        slotIndex:
          type: integer
          example: 1
        callsign:
          type: string
          example: "VORTEX"
        reason:
          type: string
          enum: [SPIKE, MIN_LAP, LAP_TOO_LONG]
          example: MIN_LAP
        detail:
          type: string
          example: "2.14s < 5.00s min lap"
        peakRssiDbm:
          type: number
          example: -51.0

    SectorSplit:
      type: object
      properties:
        sectorIndex:
          type: integer
          example: 1
        fromGateId:
          type: integer
          example: 1
        toGateId:
          type: integer
          example: 2
        label:
          type: string
          example: "S1"
        splitSeconds:
          type: number
          example: 4.612
        deltaToBestSec:
          type: number
          example: -0.104
        exitSpeedMph:
          type: number
          example: 42.5
        badge:
          $ref: "#/components/schemas/SectorBadge"

    LapRecord:
      type: object
      required: [lapId, slotIndex, callsign, lapNumber, lapTimeSec, completedAtUs, isBestLap]
      properties:
        lapId:
          type: integer
          example: 29
        slotIndex:
          type: integer
          example: 1
        callsign:
          type: string
          example: "VORTEX"
        lapNumber:
          type: integer
          example: 3
        lapTimeSec:
          type: number
          example: 14.284
        deltaToBest:
          type: number
          example: -0.312
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorSplit"
        completedAtUs:
          type: integer
          example: 48219400
        isBestLap:
          type: boolean
          example: true
        invalidated:
          type: boolean
          example: false

    RaceLifecycleRequest:
      type: object
      properties:
        reason:
          type: string
          example: "Weather delay"
        preemptOngoing:
          type: boolean
          example: true

    RaceControlRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, pause, resume, stop, cancel, emergency_stop, reset, confirm, unlock, select, next_heat]
          example: start
        preemptOngoing:
          type: boolean
          example: true

    RaceMarshalPayload:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            - toggle_dnf
            - toggle_dq
            - toggle_dns
            - add_lap
            - toggle_lap
            - add_crossing
            - move_crossing
            - delete_crossing
            - move_up
            - move_down
            - reorder_seats
            - set_penalty
            - clear_override
