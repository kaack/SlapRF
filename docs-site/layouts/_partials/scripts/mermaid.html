<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" crossorigin="anonymous"></script>

<template id="doc-mermaid-expand-btn-template">
  <button type="button" class="doc-mermaid-expand-btn" aria-label="Expand diagram" title="Expand diagram">
    <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12.5 3.5h4v4M16.5 3.5l-5 5M7.5 16.5h-4v-4M3.5 16.5l5-5" />
    </svg>
    <span>Expand</span>
  </button>
</template>

<template id="doc-mermaid-modal-template">
  <div class="doc-mermaid-modal" data-open="false" role="dialog" aria-modal="true" aria-label="Expanded diagram">
    <div class="doc-mermaid-modal-dialog">
      <div class="doc-mermaid-modal-head">
        <span class="doc-mermaid-modal-title">Diagram View</span>
        <button type="button" class="doc-mermaid-modal-close" data-mermaid-close="1" aria-label="Close diagram">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M5 5l10 10M15 5L5 15" />
          </svg>
        </button>
      </div>
      <div class="doc-mermaid-modal-body"></div>
    </div>
  </div>
</template>

{{- with resources.Get "js/mermaid-init.js" -}}
  {{- $initJs := . | fingerprint -}}
  <script defer src="{{ $initJs.RelPermalink }}" integrity="{{ $initJs.Data.Integrity }}"></script>
{{- end -}}
