<button
  type="button"
  class="doc-theme-switch"
  data-doc-theme-switch="1"
  role="switch"
  aria-label="Toggle dark mode"
  title="Switch light / dark theme"
>
  <span class="doc-theme-switch-track" aria-hidden="true">
    <span class="doc-theme-switch-icon is-sun">
      <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="3.5" />
        <path d="M10 2.2v1.8M10 16v1.8M2.2 10h1.8M16 10h1.8M4.5 4.5l1.3 1.3M14.2 14.2l1.3 1.3M15.5 4.5l-1.3 1.3M5.8 14.2l-1.3 1.3" />
      </svg>
    </span>
    <span class="doc-theme-switch-icon is-moon">
      <svg viewBox="0 0 20 20" width="12.5" height="12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15.6 12.6A6.5 6.5 0 0 1 7.4 4.4a6.5 6.5 0 1 0 8.2 8.2Z" />
      </svg>
    </span>
    <span class="doc-theme-switch-thumb"></span>
  </span>
</button>
