<div
  class="doc-theme-switch"
  data-doc-theme-switch="1"
  role="radiogroup"
  aria-label="Color theme"
>
  <span class="doc-theme-switch-track">
    <span class="doc-theme-switch-thumb" aria-hidden="true"></span>
    <button
      type="button"
      class="doc-theme-switch-btn is-sun"
      data-doc-theme-option="light"
      role="radio"
      aria-checked="false"
      aria-label="Light theme"
      title="Light"
    >
      <svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="10" cy="10" r="3.5" />
        <path d="M10 2.2v1.8M10 16v1.8M2.2 10h1.8M16 10h1.8M4.5 4.5l1.3 1.3M14.2 14.2l1.3 1.3M15.5 4.5l-1.3 1.3M5.8 14.2l-1.3 1.3" />
      </svg>
    </button>
    <button
      type="button"
      class="doc-theme-switch-btn is-system"
      data-doc-theme-option="system"
      role="radio"
      aria-checked="true"
      aria-label="Auto theme (match browser)"
      title="Auto (match browser)"
    >
      <svg viewBox="0 0 20 20" width="12.5" height="12.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.75" y="3.5" width="14.5" height="10" rx="1.8" />
        <path d="M7.5 16.5h5M10 13.5v3" />
      </svg>
    </button>
    <button
      type="button"
      class="doc-theme-switch-btn is-moon"
      data-doc-theme-option="dark"
      role="radio"
      aria-checked="false"
      aria-label="Dark theme"
      title="Dark"
    >
      <svg viewBox="0 0 20 20" width="12.5" height="12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15.6 12.6A6.5 6.5 0 0 1 7.4 4.4a6.5 6.5 0 1 0 8.2 8.2Z" />
      </svg>
    </button>
  </span>
</div>
