{{- $role := .Get "role" | default "" -}}
{{- $label := .Get "label" | default "Open Firmware Flasher" -}}
<div class="doc-flasher-inline-action not-prose">
  <button type="button" class="doc-flasher-launch-btn" data-open-docs-flasher="1"{{ with $role }} data-flasher-role="{{ . }}"{{ end }}>
    <svg viewBox="0 0 20 20" width="15" height="15" fill="currentColor" aria-hidden="true">
      <path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/>
    </svg>
    <span>{{ $label }}</span>
  </button>
</div>
